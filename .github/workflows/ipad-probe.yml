      - name: Build LibArchive for iPadOS
        run: |
          # We only need the library on iPadOS, not bsdcat/bsdtar/bsdcpio/bsdunzip.
          sed -i '' '/add_subdirectory(cat)/d' libarchive-3.8.1/CMakeLists.txt
          sed -i '' '/add_subdirectory(tar)/d' libarchive-3.8.1/CMakeLists.txt
          sed -i '' '/add_subdirectory(cpio)/d' libarchive-3.8.1/CMakeLists.txt
          sed -i '' '/add_subdirectory(unzip)/d' libarchive-3.8.1/CMakeLists.txt

          cmake -S libarchive-3.8.1 -B libarchive-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_INSTALL_PREFIX="$PWD/ios-deps" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_TEST=OFF \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_UNZIP=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF \
            -DENABLE_BZip2=OFF

          cmake --build libarchive-ios
          cmake --install libarchive-ios      - name: Build LibArchive for iPadOS
